<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Walkie-Talkie (実用WEBトランシーバー)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MQTT.js for public WebRTC signaling -->
    <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>

    <style>
        body {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Active transmission highlight style */
        .transmitting-active {
            background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%) !important;
            box-shadow: 0 0 35px rgba(239, 68, 68, 0.85) !important;
            border-color: #f87171 !important;
        }

        /* Custom subtle scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 2px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-3 sm:p-6">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-2xl flex flex-col justify-between min-h-[660px] relative overflow-hidden">
        
        <!-- HEADER SECTION -->
        <div>
            <!-- Title Bar -->
            <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                <div class="flex items-center gap-2">
                    <div id="connectionLed" class="w-3 h-3 rounded-full bg-slate-600 transition-colors duration-300"></div>
                    <span class="font-black text-sm tracking-widest text-slate-200">実用WEBトランシーバー</span>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="app.toggleSettingsModal()" class="text-slate-400 hover:text-amber-400 text-xs p-1.5 rounded-lg bg-slate-800/60 border border-slate-700/50 transition flex items-center gap-1" title="通信設定">
                        <i class="fa-solid fa-gear"></i>
                        <span class="text-[10px] hidden sm:inline">設定</span>
                    </button>
                    <span id="myPeerIdDisplay" class="text-[11px] font-mono text-slate-400 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">ID: ----</span>
                </div>
            </div>

            <!-- USER NAME / CALLSIGN SETTING BAR -->
            <div class="mt-3 bg-slate-950/80 p-2.5 rounded-2xl border border-slate-800/80">
                <div class="flex items-center justify-between mb-1.5">
                    <label for="callsignInput" class="text-[11px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1">
                        <i class="fa-solid fa-id-badge text-amber-500"></i> 表示名（コールサイン）
                    </label>
                    <button onclick="app.generateRandomName()" class="text-[10px] text-amber-400 hover:text-amber-300 bg-slate-800 hover:bg-slate-700 px-2 py-0.5 rounded-lg border border-slate-700 transition flex items-center gap-1">
                        <i class="fa-solid fa-dice"></i> 自動生成
                    </button>
                </div>
                <input id="callsignInput" type="text" maxlength="16" placeholder="例: 8J2WWM / 本部" 
                    oninput="app.updateCallsign(this.value)"
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-amber-300 font-bold focus:outline-none focus:border-amber-500 transition">
            </div>

            <!-- CHANNEL SELECTOR SECTION -->
            <div id="channelBox" class="mt-3 bg-slate-950 p-3 rounded-2xl border border-slate-800">
                <div id="joinSection" class="flex flex-col gap-2">
                    <label for="channelSelect" class="text-[11px] font-bold text-slate-400 uppercase tracking-wider flex justify-between">
                        <span>チャンネル選択 (CH1〜15)</span>
                        <span class="text-emerald-400 font-semibold"><i class="fa-solid fa-bolt text-xs"></i> 即時切替</span>
                    </label>
                    <div class="flex gap-1.5 items-center">
                        <button onclick="app.stepChannel(-1)" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 font-bold w-10 h-10 rounded-xl flex items-center justify-center shrink-0 border border-slate-700 transition">
                            <i class="fa-solid fa-chevron-left text-xs"></i>
                        </button>
                        <select id="channelSelect" onchange="app.onChannelSelectChange()" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 h-10 text-xs sm:text-sm text-slate-100 font-bold focus:outline-none focus:border-amber-500 cursor-pointer">
                            <option value="CH01" selected>CH1 (呼び出し)</option>
                            <option value="CH02">CH2</option>
                            <option value="CH03">CH3</option>
                            <option value="CH04">CH4</option>
                            <option value="CH05">CH5</option>
                            <option value="CH06">CH6</option>
                            <option value="CH07">CH7</option>
                            <option value="CH08">CH8</option>
                            <option value="CH09">CH9</option>
                            <option value="CH10">CH10</option>
                            <option value="CH11">CH11</option>
                            <option value="CH12">CH12</option>
                            <option value="CH13">CH13</option>
                            <option value="CH14">CH14</option>
                            <option value="CH15">CH15</option>
                        </select>
                        <button onclick="app.stepChannel(1)" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 font-bold w-10 h-10 rounded-xl flex items-center justify-center shrink-0 border border-slate-700 transition">
                            <i class="fa-solid fa-chevron-right text-xs"></i>
                        </button>
                        <button id="joinBtn" onclick="app.joinChannel()" class="bg-amber-500 hover:bg-amber-400 active:scale-95 text-slate-950 font-black h-10 px-4 rounded-xl text-xs transition flex items-center gap-1 shrink-0 shadow-lg">
                            <i class="fa-solid fa-plug"></i> 接続
                        </button>
                    </div>
                </div>

                <!-- Active Channel Display Bar -->
                <div id="activeSection" class="hidden flex items-center justify-between">
                    <div>
                        <div class="text-[10px] text-slate-400 uppercase font-bold">現在のチャンネル</div>
                        <div class="text-base sm:text-lg font-black text-amber-400 flex items-center gap-2">
                            <i class="fa-solid fa-tower-cell text-sm"></i>
                            <span id="currentChannelName">CH1 (呼び出し)</span>
                        </div>
                    </div>
                    <button onclick="app.leaveChannel(false)" class="bg-rose-950/80 hover:bg-rose-900 text-rose-300 text-xs px-3.5 py-2 rounded-xl font-bold border border-rose-800 transition active:scale-95">
                        <i class="fa-solid fa-power-off mr-1"></i> 切断
                    </button>
                </div>
            </div>
        </div>

        <!-- MAIN PTT SECTION -->
        <div class="my-5 flex flex-col items-center justify-center flex-1">
            
            <!-- Voice Activity / Status Badge -->
            <div id="statusDisplay" class="mb-4 text-center min-h-[36px] flex flex-col items-center justify-center">
                <div id="statusBadge" class="px-4 py-1.5 rounded-full bg-slate-800/80 border border-slate-700 text-xs font-bold text-slate-400 flex items-center gap-2">
                    <span id="statusLedDot" class="w-2 h-2 rounded-full bg-slate-500"></span>
                    <span id="statusText">未接続 (「接続」を押してスタート)</span>
                </div>
            </div>

            <!-- BIG PTT (PUSH TO TALK) BUTTON -->
            <div class="relative flex items-center justify-center my-2">
                <button id="pttBtn" disabled
                    class="w-44 h-44 sm:w-48 sm:h-48 rounded-full bg-gradient-to-b from-slate-800 to-slate-900 border-4 border-slate-700 shadow-2xl flex flex-col items-center justify-center text-slate-500 font-black tracking-wider transition-all duration-100 cursor-not-allowed opacity-50 select-none">
                    <i class="fa-solid fa-microphone text-4xl mb-2"></i>
                    <span id="pttMainText" class="text-sm sm:text-base tracking-widest">PUSH TO TALK</span>
                    <span id="pttSubText" class="text-[10px] font-normal text-slate-400 mt-1">押している間だけ送信</span>
                </button>
            </div>

            <!-- Key Guide -->
            <div class="mt-3 text-center">
                <span class="text-[11px] text-slate-400 flex items-center justify-center gap-1">
                    <kbd class="px-2 py-0.5 bg-slate-800 border border-slate-700 rounded text-[10px] text-slate-300 font-mono">SPACE</kbd>
                    キー長押しでも送信可能
                </span>
            </div>
        </div>

        <!-- ONLINE MEMBERS DISPLAY -->
        <div>
            <div class="flex justify-between items-center mb-2 px-1">
                <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                    <i class="fa-solid fa-users text-amber-500"></i> オンラインメンバー (<span id="memberCount">0</span>人)
                </span>
            </div>

            <div id="memberList" class="bg-slate-950/90 border border-slate-800 rounded-2xl p-2.5 min-h-[65px] max-h-[105px] overflow-y-auto flex flex-wrap gap-2 items-start">
                <div class="text-xs text-slate-500 p-2 italic w-full text-center">チャンネルに接続すると参加者が表示されます</div>
            </div>
        </div>

    </div>

    <!-- SETTINGS MODAL -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 max-w-sm w-full text-xs shadow-2xl">
            <div class="flex justify-between items-center pb-3 border-b border-slate-800 mb-3">
                <h3 class="font-bold text-slate-200 flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-network-wired text-amber-500"></i> 通信・TURNリレー設定
                </h3>
                <button onclick="app.toggleSettingsModal()" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <div class="bg-emerald-950/50 border border-emerald-800/80 rounded-xl p-2.5 mb-3 text-emerald-300 text-[11px] leading-relaxed flex items-start gap-2">
                <i class="fa-solid fa-circle-check text-emerald-400 text-sm mt-0.5"></i>
                <div>
                    <strong>通常は設定不要です</strong><br>
                    標準でSTUN/TURNリレーが自動適用されているため、この設定を変更しなくても通信できます。
                </div>
            </div>

            <div class="space-y-2.5">
                <div>
                    <label class="block text-slate-300 font-bold mb-1">カスタム TURN サーバー URL</label>
                    <input id="customTurnUrl" type="text" placeholder="turn:your-server.com:3478" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-slate-200 focus:outline-none focus:border-amber-500 font-mono text-[11px]">
                </div>
                <div>
                    <label class="block text-slate-300 font-bold mb-1">ユーザー名</label>
                    <input id="customTurnUser" type="text" placeholder="username" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-slate-200 focus:outline-none focus:border-amber-500 font-mono text-[11px]">
                </div>
                <div>
                    <label class="block text-slate-300 font-bold mb-1">パスワード</label>
                    <input id="customTurnPass" type="password" placeholder="password" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-slate-200 focus:outline-none focus:border-amber-500 font-mono text-[11px]">
                </div>
            </div>

            <div class="mt-4 flex gap-2 justify-end">
                <button onclick="app.saveCustomTurn()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs transition">
                    保存して適用
                </button>
            </div>
        </div>
    </div>

    <!-- Hidden Container for Remote Audio Streams -->
    <div id="remoteAudioContainer" class="hidden"></div>

    <script>
        class WebWalkieTalkie {
            constructor() {
                this.myId = '';
                this.callsign = '';
                this.selectedChannel = 'CH01';
                this.localStream = null;
                this.isTransmitting = false;
                this.isConnected = false;

                // WebRTC Peer Connections & State
                this.peerConnections = {}; // peerId -> RTCPeerConnection
                this.remoteAudios = {};     // peerId -> HTMLAudioElement
                this.iceQueues = {};        // peerId -> candidate array
                this.members = new Map();  // peerId -> member object

                // Public MQTT Signaling Brokers (Resilient WebSocket fallback list)
                this.mqttBrokers = [
                    'wss://broker.emqx.io:8084/mqtt',
                    'wss://broker.hivemq.com:8884/mqtt',
                    'wss://test.mosquitto.org:8081/mqtt'
                ];
                this.currentBrokerIdx = 0;
                this.mqttClient = null;
                this.mqttTopic = '';
                
                this.broadcastChannel = null;
                this.heartbeatInterval = null;

                // Built-in STUN & OpenRelay TURN servers for cross-network traversal
                this.defaultIceServers = [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun.services.mozilla.com' },
                    {
                        urls: [
                            'turn:openrelay.metered.ca:80',
                            'turn:openrelay.metered.ca:443',
                            'turns:openrelay.metered.ca:443?transport=tcp'
                        ],
                        username: 'openrelayproject',
                        credential: 'openrelayproject'
                    }
                ];

                this.rtcConfig = {
                    iceServers: [...this.defaultIceServers],
                    iceCandidatePoolSize: 10
                };

                this.initCallsign();
                this.loadSavedTurnConfig();
                this.initUI();
            }

            initCallsign() {
                const savedName = localStorage.getItem('walkie_callsign');
                if (savedName) {
                    this.callsign = savedName;
                } else {
                    this.generateRandomName(false);
                }
                document.getElementById('callsignInput').value = this.callsign;
            }

            generateRandomName(updateInput = true) {
                // 英数字6桁のランダムコールサインを生成
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                let randomCode = '';
                for (let i = 0; i < 6; i++) {
                    randomCode += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                this.callsign = randomCode;
                
                localStorage.setItem('walkie_callsign', this.callsign);

                if (updateInput) {
                    document.getElementById('callsignInput').value = this.callsign;
                    this.broadcastCallsignUpdate();
                }
            }

            updateCallsign(val) {
                const cleanVal = val.trim() || '無名局';
                this.callsign = cleanVal;
                localStorage.setItem('walkie_callsign', this.callsign);
                this.broadcastCallsignUpdate();
            }

            broadcastCallsignUpdate() {
                if (this.isConnected) {
                    const selfMember = this.members.get(this.myId);
                    if (selfMember) {
                        selfMember.callsign = this.callsign;
                        this.renderMembers();
                    }
                    this.sendSignal('ALL', {
                        type: 'HEARTBEAT',
                        peerId: this.myId,
                        callsign: this.callsign,
                        isTalking: this.isTransmitting
                    });
                }
            }

            loadSavedTurnConfig() {
                try {
                    const saved = localStorage.getItem('walkie_custom_turn');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed.url) {
                            this.rtcConfig.iceServers.unshift({
                                urls: parsed.url,
                                username: parsed.user || '',
                                credential: parsed.pass || ''
                            });
                        }
                    }
                } catch(e) {}
            }

            toggleSettingsModal() {
                const modal = document.getElementById('settingsModal');
                modal.classList.toggle('hidden');
            }

            saveCustomTurn() {
                const url = document.getElementById('customTurnUrl').value.trim();
                const user = document.getElementById('customTurnUser').value.trim();
                const pass = document.getElementById('customTurnPass').value.trim();

                if (url) {
                    localStorage.setItem('walkie_custom_turn', JSON.stringify({ url, user, pass }));
                } else {
                    localStorage.removeItem('walkie_custom_turn');
                }
                this.toggleSettingsModal();
                if (this.isConnected) {
                    this.switchChannel();
                }
            }

            initUI() {
                const pttBtn = document.getElementById('pttBtn');

                const startTx = (e) => {
                    e.preventDefault();
                    if (!this.isConnected || this.isTransmitting) return;
                    this.startTransmit();
                };
                const stopTx = (e) => {
                    e.preventDefault();
                    if (!this.isConnected || !this.isTransmitting) return;
                    this.stopTransmit();
                };

                pttBtn.addEventListener('mousedown', startTx);
                pttBtn.addEventListener('mouseup', stopTx);
                pttBtn.addEventListener('mouseleave', stopTx);
                pttBtn.addEventListener('touchstart', startTx, { passive: false });
                pttBtn.addEventListener('touchend', stopTx, { passive: false });

                window.addEventListener('keydown', (e) => {
                    if (e.code === 'Space' && !e.repeat && !this.isTransmitting && 
                        document.activeElement.tagName !== 'SELECT' && 
                        document.activeElement.tagName !== 'INPUT') {
                        e.preventDefault();
                        if (this.isConnected) this.startTransmit();
                    }
                });

                window.addEventListener('keyup', (e) => {
                    if (e.code === 'Space' && this.isTransmitting && 
                        document.activeElement.tagName !== 'SELECT' && 
                        document.activeElement.tagName !== 'INPUT') {
                        e.preventDefault();
                        if (this.isConnected) this.stopTransmit();
                    }
                });

                window.addEventListener('beforeunload', () => {
                    this.leaveChannel(false);
                });
            }

            async onChannelSelectChange() {
                if (this.isConnected) {
                    await this.switchChannel();
                }
            }

            async stepChannel(delta) {
                const selectEl = document.getElementById('channelSelect');
                let newIndex = selectEl.selectedIndex + delta;
                if (newIndex < 0) newIndex = selectEl.options.length - 1;
                if (newIndex >= selectEl.options.length) newIndex = 0;

                selectEl.selectedIndex = newIndex;
                if (this.isConnected) {
                    await this.switchChannel();
                }
            }

            async switchChannel() {
                await this.leaveChannel(true);
                await this.joinChannel();
            }

            async joinChannel() {
                const selectEl = document.getElementById('channelSelect');
                this.selectedChannel = selectEl.value;
                const channelLabel = selectEl.options[selectEl.selectedIndex].text;

                // Request microphone permissions
                if (!this.localStream) {
                    try {
                        this.localStream = await navigator.mediaDevices.getUserMedia({
                            audio: {
                                echoCancellation: true,
                                noiseSuppression: true,
                                autoGainControl: true
                            }
                        });
                    } catch (err) {
                        this.updateStatusBadge('red', 'マイクへのアクセスを許可してください');
                        return;
                    }
                }

                // Keep mic tracks disabled until PTT is pressed
                this.localStream.getAudioTracks().forEach(track => track.enabled = false);

                this.isConnected = true;
                document.getElementById('joinBtn').disabled = true;
                this.updateStatusBadge('yellow', '接続中...');

                // Generate random session ID
                const randomId = Math.random().toString(36).substring(2, 7).toUpperCase();
                this.myId = `wtlk-${this.selectedChannel}-${randomId}`;

                document.getElementById('myPeerIdDisplay').innerText = `ID: ${randomId}`;
                document.getElementById('joinSection').classList.add('hidden');
                document.getElementById('activeSection').classList.remove('hidden');
                document.getElementById('currentChannelName').innerText = channelLabel;

                const pttBtn = document.getElementById('pttBtn');
                pttBtn.disabled = false;
                pttBtn.classList.remove('cursor-not-allowed', 'opacity-50');
                pttBtn.classList.add('bg-gradient-to-b', 'from-emerald-600', 'to-emerald-800', 'border-emerald-500', 'text-white', 'hover:opacity-90');

                document.getElementById('connectionLed').className = 'w-3 h-3 rounded-full bg-emerald-500 animate-pulse';

                this.updateStatusBadge('green', '待機中 (ボタンを押して送信)');

                // Register self in active channel members list
                this.members.set(this.myId, { 
                    id: this.myId, 
                    callsign: this.callsign || '無名局', 
                    isSelf: true, 
                    isTalking: false, 
                    lastActive: Date.now() 
                });
                this.renderMembers();

                // BroadcastChannel for instant local tab-to-tab signaling
                if (typeof BroadcastChannel !== 'undefined') {
                    this.broadcastChannel = new BroadcastChannel(`walkie_talkie_${this.selectedChannel}`);
                    this.broadcastChannel.onmessage = (event) => this.handleSignal(event.data);
                    
                    this.sendSignal('ALL', { type: 'ANNOUNCE', peerId: this.myId, callsign: this.callsign });
                }

                // Start public MQTT WebSocket signaling
                this.startMqttSignaling();
            }

            startMqttSignaling() {
                this.mqttTopic = `web_walkie_talkie_p2p/${this.selectedChannel}/signal`;
                this.connectMqttBroker(0);

                this.heartbeatInterval = setInterval(() => {
                    if (this.isConnected) {
                        this.sendSignal('ALL', { 
                            type: 'HEARTBEAT', 
                            peerId: this.myId, 
                            callsign: this.callsign,
                            isTalking: this.isTransmitting
                        });
                        this.cleanInactiveMembers();
                    }
                }, 3000);
            }

            connectMqttBroker(brokerIdx) {
                if (!this.isConnected) return;
                this.currentBrokerIdx = brokerIdx;
                const brokerUrl = this.mqttBrokers[this.currentBrokerIdx];

                try {
                    if (this.mqttClient) {
                        this.mqttClient.end(true);
                    }

                    this.mqttClient = mqtt.connect(brokerUrl, {
                        clientId: this.myId + '_' + Math.random().toString(36).substring(2, 5),
                        keepalive: 15,
                        reconnectPeriod: 2500,
                        connectTimeout: 5000
                    });

                    this.mqttClient.on('connect', () => {
                        this.mqttClient.subscribe(this.mqttTopic, { qos: 0 });
                        this.sendSignal('ALL', { 
                            type: 'ANNOUNCE', 
                            peerId: this.myId, 
                            callsign: this.callsign 
                        });
                    });

                    this.mqttClient.on('message', (topic, message) => {
                        try {
                            const data = JSON.parse(message.toString());
                            this.handleSignal(data);
                        } catch (e) {}
                    });

                    this.mqttClient.on('error', () => {
                        this.tryNextBroker();
                    });
                } catch(e) {
                    this.tryNextBroker();
                }
            }

            tryNextBroker() {
                if (this.mqttBrokers.length <= 1) return;
                const nextIdx = (this.currentBrokerIdx + 1) % this.mqttBrokers.length;
                setTimeout(() => {
                    if (this.isConnected) this.connectMqttBroker(nextIdx);
                }, 2000);
            }

            sendSignal(targetPeerId, payload) {
                const signalMessage = {
                    from: this.myId,
                    to: targetPeerId,
                    timestamp: Date.now(),
                    ...payload
                };

                // Send locally via BroadcastChannel
                if (this.broadcastChannel) {
                    try {
                        this.broadcastChannel.postMessage(signalMessage);
                    } catch(e) {}
                }

                // Send globally via MQTT WebSocket
                if (this.mqttClient && this.mqttClient.connected) {
                    try {
                        this.mqttClient.publish(this.mqttTopic, JSON.stringify(signalMessage), { qos: 0 });
                    } catch(e) {}
                }
            }

            async handleSignal(msg) {
                if (!this.isConnected || !msg || msg.from === this.myId) return;
                if (msg.to !== 'ALL' && msg.to !== this.myId) return;

                const remotePeerId = msg.from;
                const remoteCallsign = msg.callsign || '通信局';

                // Update peer activity
                this.members.set(remotePeerId, {
                    id: remotePeerId,
                    callsign: remoteCallsign,
                    isSelf: false,
                    isTalking: !!msg.isTalking,
                    lastActive: Date.now()
                });
                this.renderMembers();

                switch (msg.type) {
                    case 'ANNOUNCE':
                        this.sendSignal(remotePeerId, { 
                            type: 'HEARTBEAT', 
                            peerId: this.myId, 
                            callsign: this.callsign,
                            isTalking: this.isTransmitting
                        });
                        if (this.myId < remotePeerId) {
                            this.initiatePeerConnection(remotePeerId);
                        }
                        break;

                    case 'HEARTBEAT':
                        if (this.myId < remotePeerId && !this.peerConnections[remotePeerId]) {
                            this.initiatePeerConnection(remotePeerId);
                        }
                        break;

                    case 'OFFER':
                        await this.handleOffer(remotePeerId, msg.offer);
                        break;

                    case 'ANSWER':
                        await this.handleAnswer(remotePeerId, msg.answer);
                        break;

                    case 'ICE':
                        await this.handleIceCandidate(remotePeerId, msg.candidate);
                        break;

                    case 'TALK_START':
                        this.setMemberTalking(remotePeerId, true);
                        break;

                    case 'TALK_STOP':
                        this.setMemberTalking(remotePeerId, false);
                        break;

                    case 'LEAVE':
                        this.removePeer(remotePeerId);
                        break;
                }
            }

            createPeerConnection(remotePeerId) {
                if (this.peerConnections[remotePeerId]) {
                    return this.peerConnections[remotePeerId];
                }

                const pc = new RTCPeerConnection(this.rtcConfig);
                this.peerConnections[remotePeerId] = pc;
                this.iceQueues[remotePeerId] = [];

                if (this.localStream) {
                    this.localStream.getTracks().forEach(track => {
                        pc.addTrack(track, this.localStream);
                    });
                }

                pc.onicecandidate = (event) => {
                    if (event.candidate) {
                        this.sendSignal(remotePeerId, {
                            type: 'ICE',
                            candidate: event.candidate
                        });
                    }
                };

                pc.ontrack = (event) => {
                    let audioEl = this.remoteAudios[remotePeerId];
                    if (!audioEl) {
                        audioEl = document.createElement('audio');
                        audioEl.autoplay = true;
                        audioEl.playsInline = true;
                        document.getElementById('remoteAudioContainer').appendChild(audioEl);
                        this.remoteAudios[remotePeerId] = audioEl;
                    }
                    audioEl.srcObject = event.streams[0];
                };

                return pc;
            }

            async initiatePeerConnection(remotePeerId) {
                const pc = this.createPeerConnection(remotePeerId);
                try {
                    const offer = await pc.createOffer({ offerToReceiveAudio: true });
                    await pc.setLocalDescription(offer);
                    this.sendSignal(remotePeerId, { type: 'OFFER', offer: offer });
                } catch(e) {}
            }

            async handleOffer(remotePeerId, offer) {
                const pc = this.createPeerConnection(remotePeerId);
                try {
                    await pc.setRemoteDescription(new RTCSessionDescription(offer));
                    
                    if (this.iceQueues[remotePeerId]) {
                        for (const cand of this.iceQueues[remotePeerId]) {
                            await pc.addIceCandidate(new RTCIceCandidate(cand));
                        }
                        this.iceQueues[remotePeerId] = [];
                    }

                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    this.sendSignal(remotePeerId, { type: 'ANSWER', answer: answer });
                } catch(e) {}
            }

            async handleAnswer(remotePeerId, answer) {
                const pc = this.peerConnections[remotePeerId];
                if (pc) {
                    try {
                        await pc.setRemoteDescription(new RTCSessionDescription(answer));
                    } catch(e) {}
                }
            }

            async handleIceCandidate(remotePeerId, candidate) {
                const pc = this.peerConnections[remotePeerId];
                if (pc && pc.remoteDescription) {
                    try {
                        await pc.addIceCandidate(new RTCIceCandidate(candidate));
                    } catch(e) {}
                } else {
                    if (!this.iceQueues[remotePeerId]) this.iceQueues[remotePeerId] = [];
                    this.iceQueues[remotePeerId].push(candidate);
                }
            }

            startTransmit() {
                if (!this.isConnected || this.isTransmitting) return;

                this.isTransmitting = true;
                
                if (this.localStream) {
                    this.localStream.getAudioTracks().forEach(track => track.enabled = true);
                }

                const pttBtn = document.getElementById('pttBtn');
                pttBtn.classList.add('transmitting-active');
                document.getElementById('pttMainText').innerText = 'TRANSMITTING';
                document.getElementById('pttSubText').innerText = '送信中 (離して待機)';

                this.updateStatusBadge('red', '送信中 (あなたの声が配信されています)');
                this.setMemberTalking(this.myId, true);

                this.sendSignal('ALL', { type: 'TALK_START', isTalking: true });
            }

            stopTransmit() {
                if (!this.isConnected || !this.isTransmitting) return;

                this.isTransmitting = false;

                if (this.localStream) {
                    this.localStream.getAudioTracks().forEach(track => track.enabled = false);
                }

                const pttBtn = document.getElementById('pttBtn');
                pttBtn.classList.remove('transmitting-active');
                document.getElementById('pttMainText').innerText = 'PUSH TO TALK';
                document.getElementById('pttSubText').innerText = '押している間だけ送信';

                this.updateStatusBadge('green', '待機中 (ボタンを押して送信)');
                this.setMemberTalking(this.myId, false);

                this.sendSignal('ALL', { type: 'TALK_STOP', isTalking: false });
            }

            setMemberTalking(peerId, isTalking) {
                const member = this.members.get(peerId);
                if (member) {
                    member.isTalking = isTalking;
                    this.renderMembers();
                }
            }

            cleanInactiveMembers() {
                const now = Date.now();
                let changed = false;
                for (const [id, member] of this.members.entries()) {
                    if (!member.isSelf && now - member.lastActive > 9000) {
                        this.removePeer(id);
                        changed = true;
                    }
                }
                if (changed) this.renderMembers();
            }

            removePeer(peerId) {
                if (this.peerConnections[peerId]) {
                    this.peerConnections[peerId].close();
                    delete this.peerConnections[peerId];
                }
                if (this.remoteAudios[peerId]) {
                    this.remoteAudios[peerId].remove();
                    delete this.remoteAudios[peerId];
                }
                delete this.iceQueues[peerId];
                this.members.delete(peerId);
                this.renderMembers();
            }

            renderMembers() {
                const memberListEl = document.getElementById('memberList');
                const memberCountEl = document.getElementById('memberCount');

                memberCountEl.innerText = this.members.size;

                if (this.members.size === 0) {
                    memberListEl.innerHTML = '<div class="text-xs text-slate-500 p-2 italic w-full text-center">チャンネルに接続すると参加者が表示されます</div>';
                    return;
                }

                memberListEl.innerHTML = '';
                this.members.forEach((member) => {
                    const badge = document.createElement('div');
                    const isSelfText = member.isSelf ? ' (自分)' : '';
                    
                    let bgClasses = 'bg-slate-800 border-slate-700 text-slate-300';
                    let icon = '<i class="fa-solid fa-user text-[10px]"></i>';

                    if (member.isTalking) {
                        bgClasses = 'bg-rose-950 border-rose-600 text-rose-200 animate-pulse font-bold';
                        icon = '<i class="fa-solid fa-microphone text-[10px] text-rose-400"></i>';
                    } else if (member.isSelf) {
                        bgClasses = 'bg-amber-950/60 border-amber-800/80 text-amber-300';
                    }

                    badge.className = `px-2.5 py-1 rounded-xl border text-[11px] flex items-center gap-1.5 transition ${bgClasses}`;
                    badge.innerHTML = `${icon} <span class="font-bold">${member.callsign}</span><span class="text-[10px] opacity-75">${isSelfText}</span>`;
                    memberListEl.appendChild(badge);
                });
            }

            updateStatusBadge(color, text) {
                const badge = document.getElementById('statusBadge');
                const dot = document.getElementById('statusLedDot');
                const statusText = document.getElementById('statusText');

                statusText.innerText = text;

                if (color === 'red') {
                    dot.className = 'w-2 h-2 rounded-full bg-rose-500 animate-ping';
                    badge.className = 'px-4 py-1.5 rounded-full bg-rose-950/80 border border-rose-800 text-xs font-bold text-rose-300 flex items-center gap-2';
                } else if (color === 'green') {
                    dot.className = 'w-2 h-2 rounded-full bg-emerald-400';
                    badge.className = 'px-4 py-1.5 rounded-full bg-emerald-950/60 border border-emerald-800/80 text-xs font-bold text-emerald-300 flex items-center gap-2';
                } else if (color === 'yellow') {
                    dot.className = 'w-2 h-2 rounded-full bg-amber-400 animate-pulse';
                    badge.className = 'px-4 py-1.5 rounded-full bg-amber-950/60 border border-amber-800/80 text-xs font-bold text-amber-300 flex items-center gap-2';
                } else {
                    dot.className = 'w-2 h-2 rounded-full bg-slate-500';
                    badge.className = 'px-4 py-1.5 rounded-full bg-slate-800/80 border border-slate-700 text-xs font-bold text-slate-400 flex items-center gap-2';
                }
            }

            async leaveChannel(keepStream = false) {
                if (this.isTransmitting) {
                    this.stopTransmit();
                }

                if (this.heartbeatInterval) {
                    clearInterval(this.heartbeatInterval);
                    this.heartbeatInterval = null;
                }

                this.sendSignal('ALL', { type: 'LEAVE' });

                Object.keys(this.peerConnections).forEach(id => {
                    this.removePeer(id);
                });

                if (this.broadcastChannel) {
                    this.broadcastChannel.close();
                    this.broadcastChannel = null;
                }

                if (this.mqttClient) {
                    this.mqttClient.end(true);
                    this.mqttClient = null;
                }

                if (!keepStream && this.localStream) {
                    this.localStream.getTracks().forEach(track => track.stop());
                    this.localStream = null;
                }

                this.isConnected = false;
                this.members.clear();

                document.getElementById('joinBtn').disabled = false;
                document.getElementById('myPeerIdDisplay').innerText = 'ID: ----';
                document.getElementById('joinSection').classList.remove('hidden');
                document.getElementById('activeSection').classList.add('hidden');

                const pttBtn = document.getElementById('pttBtn');
                pttBtn.disabled = true;
                pttBtn.className = 'w-44 h-44 sm:w-48 sm:h-48 rounded-full bg-gradient-to-b from-slate-800 to-slate-900 border-4 border-slate-700 shadow-2xl flex flex-col items-center justify-center text-slate-500 font-black tracking-wider transition-all duration-100 cursor-not-allowed opacity-50 select-none';

                document.getElementById('connectionLed').className = 'w-3 h-3 rounded-full bg-slate-600';

                this.updateStatusBadge('gray', '未接続 (「接続」を押してスタート)');
                this.renderMembers();
            }
        }

        // Initialize application on window load
        let app;
        window.onload = () => {
            app = new WebWalkieTalkie();
        };
    </script>
</body>
</html>
